<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <link rel="stylesheet" href="home.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
  <div class="dashboard">
    <aside class="sidebar">
      <h2>Dashboard</h2>
      <nav>
        <ul>
          <li><i class="icon"><i class="fa-solid fa-user"></i></i> Student Registration</li>
          <li><i class="icon"><i class="fa-solid fa-folder"></i></i> View Authorize Students</li>
          <li><i class="icon"><i class="fa-solid fa-pen"></i></i> Mark Attendance</li>
          <li><i class="icon"><i class="fa-solid fa-circle-info"></i></i> Attendance Details</li>
          <li><i class="icon"><i class="fa-solid fa-camera"></i></i> Camera Configuration</li>
        </ul>
      </nav>
    </aside>
    <main class="main-content">
      <h1>Facial Recognition Attendance System</h1>
      <br>
      <div class="main-buttons">
        <button><i class="fa-solid fa-user"></i> Register Students</button>
        <button><i class="fa-solid fa-folder"></i> Authorize Students</button>
        <button><i class="fa-solid fa-pen"></i> Mark Attendance</button>
        
        <button><i class="fa-solid fa-circle-info"></i> View Attendance</button>
        <button><i class="fa-solid fa-camera"></i> Configure Camera</button>
      </div>
    </main>
  </div>
</body>
</html>
