<!DOCTYPE html>
<html lang='en'>

<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>Faculty Login</title>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <link rel='stylesheet' href='login.css'>
    <script>
        function validateEmail(event) {
            const emailInput = document.getElementById('email');
            const email = emailInput.value;
            const domain = "@bmsce.ac.in";

            if (!email.endsWith(domain)) {
                alert("Please use a valid @bmsce.ac.in email address.");
                event.preventDefault(); // Prevent form submission
                return false;
            }
            // Redirect to home.html upon successful validation
            window.location.href = "home.html";
        }
    </script>
</head>

<body background="white">
    <section>
        <div class="form-box">
            <div class="form-value">
                <form onsubmit="validateEmail(event); return false;">
                    <h2>Faculty Sign In</h2>
                    <div class="inputbox">
                        <ion-icon name="mail-outline"></ion-icon>
                        <input type="email" id="email" required>
                        <label>Email</label>
                    </div>
                    <div class="inputbox">
                        <ion-icon name="lock-closed-outline"></ion-icon>
                        <input type="password" required>
                        <label>Password</label>
                    </div>
                    <div class="forget">
                        <label><input type="checkbox">Remember Me</label>
                        <a href="#">Forgot Password</a>
                    </div>
                    <button type="button" onclick="validateEmail(event)">Log In</button>
                    <div class="register">
                        <p>Don't have an account? <a href="#">Sign Up</a></p>
                    </div>
                </form>
            </div>
        </div>
    </section>
</body>

</html>
