<!DOCTYPE html>
<!---Coding By CodingLab | www.codinglabweb.com--->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="stylesheet" href="reg.css" />
    <script>
      function handleSubmit(event) {
        // Prevent form's default submission behavior
        event.preventDefault();
        
        // Check if the file input has a file
        const fileInput = document.querySelector('input[type="file"]');
        if (!fileInput.files.length) {
          alert("Please upload a photo before submitting the form.");
          return;
        }

        // Redirect to home.html if a file is uploaded
        window.location.href = "home.html";
      }
    </script>
  </head>
  <body>
    <section class="container">
      <header>Registration Form</header>
      <form class="form" onsubmit="handleSubmit(event)">
        <div class="input-box">
          <label>Full Name</label>
          <input type="text" placeholder="Enter full name" required />
        </div>
        <div class="input-box">
          <label>USN</label>
          <input type="alphanumeric" placeholder="Enter USN" required />
        </div>
        <div class="input-box">
          <label>Email ID</label>
          <input type="text" placeholder="Enter college mail ID" required />
        </div>
        <div class="gender-box">
          <h3>Gender</h3>
          <div class="gender-option">
            <div class="gender">
              <input type="radio" id="check-male" name="gender" checked />
              <label for="check-male">Male</label>
            </div>
            <div class="gender">
              <input type="radio" id="check-female" name="gender" />
              <label for="check-female">Female</label>
            </div>
            <div class="gender">
              <input type="radio" id="check-other" name="gender" />
              <label for="check-other">Prefer not to say</label>
            </div>
          </div>
        </div>
        <div class="input-box address">
          <label>Department</label>
          <div class="column">
            <div class="select-box">
              <select>
                <option hidden>Enter Department</option>
                <option>Computer Science and Engineering</option>
                <option>Information Science and Engineering</option>
                <option>Artificial Intelligence</option>
                <option>Biotechnology</option>
                <option>Civil Engineering</option>
                <option>Mechanical Engineering</option>
                <option>Data Science</option>
              </select>
            </div>
          </div> 
        </div>
        <div class="input-box">
          <label>Upload Photo</label>
          <input type="file" />
        </div>
        <button type="submit">Submit</button>
      </form>
    </section>
  </body>
</html>
