<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="stylesheet" href="reg.css" />
  </head>
  <body>
    <section class="container">
      <header>Registration Form</header>
      <form action="#" class="form">
        <div class="input-box">
          <label>Full Name</label>
          <input type="text" placeholder="Enter full name" required />
        </div>
        <div class="input-box">
            <label>USN</label>
            <input type="alphanumeric" placeholder="Enter USN" required />
          </div>
        <div class="input-box">
          <label>Email ID</label>
          <input type="text" placeholder="Enter college mail ID" required />
        </div>
        <div class="gender-box">
          <h3>Gender</h3>
          <div class="gender-option">
            <div class="gender">
              <input type="radio" id="check-male" name="gender" checked />
              <label for="check-male">male</label>
            </div>
            <div class="gender">
              <input type="radio" id="check-female" name="gender" />
              <label for="check-female">Female</label>
            </div>
            <div class="gender">
              <input type="radio" id="check-other" name="gender" />
              <label for="check-other">prefer not to say</label>
            </div>
          </div>
        </div>
        <div class="input-box address">
          <label>Department</label>
          <div class="column">
            <div class="select-box">
              <select>
                <option hidden>Enter Department</option>
                <option>Computer Science and Engineering</option>
                <option>Information Science and Engineering</option>
                <option>Artificial Intelligence</option>
                <option>Biotechnology</option>
                <option>Civil Engineering</option>
                <option>Mechanical Engineering</option>
                <option>Data Science</option>
              </select>
            </div>
          </div> 
        </div>
        <div class="input-box">
          <label>Upload Photo</label>
          <input type="file" />
        </div>
        <button><a href="home.html">Submit</a></button>
      </form>
    </section>
  </body>
</html>
