<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />
  <link rel="stylesheet" href="{{ url_for('static', filename='reg.css') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <title>Registration Form</title>
</head>
<body>
  <a href="{{ url_for('home') }}" class="back-button"><i class="fa-solid fa-arrow-left"></i></a>
  <section class="container">
    <header>Registration Form</header>
    <form id="form" class="form" name="submit-to-google-sheet" method="POST" enctype="multipart/form-data" action="https://script.google.com/macros/s/AKfycbwwObjHbglW-cDCsqpUDjuY-K9CNwXuIIjyLn393RKxnuV0fHSmoasPPWM-K8fDKtbx/exec">
      <div class="input-box">
        <label>Full Name</label>
        <input type="text" placeholder="Enter full name" name="fullName" required />
      </div>
      <div class="input-box">
        <label>USN</label>
        <input type="text" placeholder="Enter USN" name="usn" required />
      </div>
      <div class="input-box">
        <label>Email ID</label>
        <input type="email" placeholder="Enter college mail ID" name="email" required />
      </div>
      <div class="gender-box">
        <h3>Gender</h3>
        <div class="gender-option">
          <div class="gender">
            <input type="radio" id="check-male" name="gender" value="male" checked />
            <label for="check-male">Male</label>
          </div>
          <div class="gender">
            <input type="radio" id="check-female" name="gender" value="female" />
            <label for="check-female">Female</label>
          </div>
          <div class="gender">
            <input type="radio" id="check-other" name="gender" value="prefer not to say" />
            <label for="check-other">Prefer not to say</label>
          </div>
        </div>
      </div>
      <div class="input-box">
        <label>Department</label>
        <div class="column">
          <div class="select-box">
            <select name="department" required>
              <option hidden>Enter Department</option>
              <option>Computer Science and Engineering</option>
              <option>Information Science and Engineering</option>
              <option>Artificial Intelligence</option>
              <option>Biotechnology</option>
              <option>Civil Engineering</option>
              <option>Mechanical Engineering</option>
              <option>Data Science</option>
            </select>
          </div>
        </div>
      </div>
      <div class="input-box">
        <label>Upload Photo</label>
        <input type="file" name="photo" id="photo" onchange="FileOnChange(this)" required />
        <img id="ImgPreview" style="width: 100px; height: 100px; display:none;" />
        <input type="hidden" id="ImgData" name="ImgData" />
      </div>
      <button type="submit" id="submitBtn">Submit</button>
      <br />
      <span id="success"></span>
    </form>
    
    <script>
      function FileOnChange(p) {
        var file = p.files[0];
        var ImgSrc = URL.createObjectURL(file);
        document.getElementById("ImgPreview").src = ImgSrc;
        document.getElementById("ImgPreview").style.display = "block"; // Show image preview
    
        let imgRead = new FileReader();
    
        imgRead.onload = function(e) {
          var AllData = e.target.result;
          var ImgData = AllData.split("base64,")[1];  // Extract base64 image data
          document.getElementById("ImgData").value = ImgData;  // Store the base64 image data in a hidden input field
        }
    
        imgRead.readAsDataURL(file);
      }
    
      const form = document.getElementById('form');
      const submitBtn = document.getElementById('submitBtn');
      
      form.addEventListener("submit", (e) => {
        e.preventDefault(); // Prevent default form submission behavior
        submitBtn.innerHTML = "Submitting..."; 
    
        const formData = new FormData(form);  // Prepare the form data to send
    
        fetch(form.action, {  // Send the form data via a POST request to the Apps Script URL
          method: 'POST',
          body: formData,
        })
        .then((res) => res.text()) 
        .then((response) => {
          submitBtn.innerHTML = "Submit"; 
          document.getElementById("success").innerText = "Form submitted successfully!"; 
          console.log(response); 
          form.reset();  // Reset the form after successful submission
        })
        .catch((error) => {
          submitBtn.innerHTML = "Submit"; 
          document.getElementById("success").innerText = "Error submitting the form. Please try again."; 
          console.error("Error:", error); 
        });
      });
    </script>
    
  </section>
</body>
</html>
