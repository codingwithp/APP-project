<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Facial Recognition Attendance System</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='home.css') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
  <div class="dashboard">
    <aside class="sidebar">
      <h2>Dashboard</h2>
      <nav>
        <ul>
          <li><i class="fa-solid fa-user"></i><a href="registration.html"> Student Registration</a></li>
          <li><i class="fa-solid fa-pen"></i><a href="javascript:void(0);" id="mark-attendance"> Mark Attendance</a></li>
          <li><i class="fa-solid fa-circle-info"></i><a href="table.html"> Attendance Details</a></li>
        </ul>
      </nav>
    </aside>
    <main class="main-content">
      <h1>Facial Recognition Attendance System</h1>
      <div class="main-buttons">
        <a href="registration.html"><button><i class="fa-solid fa-user"></i> Student Registration</button></a>
        <button id="mark"><i class="fa-solid fa-pen"></i> Mark Attendance</button>
        <a href="table.html"><button><i class="fa-solid fa-circle-info"></i> Attendance Details</button></a>
      </div>
      <div id="webcam-container" style="display:none;">
        <video id="video" width="640" height="480" autoplay></video>
        <button id="capture" onclick="captureFrame()">Capture</button>
      </div>
    </main>
  </div>

  <script>

    document.getElementById("mark").addEventListener("click", () => {
    fetch("/mark", { method: "POST" })
      .then(response => response.json())
      .then(data => {
          alert(data.message);
      })
      .catch(error => {
          alert("Error: " + error);
      });
});

  </script>
</body>
</html>
