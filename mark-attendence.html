<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mark Attendance</title>
  <link rel="stylesheet" href="home.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/js/all.min.js"></script>
  <style>
    #message {
      margin-top: 20px;
      color: green;
      font-size: 1.2em;
    }
  </style>
</head>
<body>
  <div class="dashboard">
    <aside class="sidebar">
      <h2>Dashboard</h2>
      <nav>
        <ul>
          <li><i class="fa-solid fa-user"></i><a href="registration.html"> Student Registration</a></li>
          <li><i class="fa-solid fa-pen"></i><a href="mark-attendance.html"> Mark Attendance</a></li>
          <li><i class="fa-solid fa-circle-info"></i><a href="attendance-details.html"> Attendance Details</a></li>
        </ul>
      </nav>
    </aside>
    <main class="main-content">
      <h1>Mark Attendance via Facial Recognition</h1>
      <div id="video-container">
        <p>Facial recognition is starting...</p>
        <video id="video" width="640" height="480" autoplay muted></video>
      </div>
      <div id="message"></div>
    </main>
  </div>
  
  <script>
    // Start webcam stream as soon as the page loads
    window.onload = function() {
      const video = document.getElementById('video');
      const messageDiv = document.getElementById('message');
      
      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        navigator.mediaDevices.getUserMedia({ video: true })
          .then((stream) => {
            video.srcObject = stream;

            // Send a request to the Python backend to start processing
            fetch('/start-recognition')
              .then(response => response.json())
              .then(data => {
                if (data.success) {
                  messageDiv.textContent = "Attendance marked successfully!";
                } else {
                  messageDiv.textContent = "Error in marking attendance.";
                }
              })
              .catch(error => {
                console.error('Error:', error);
                messageDiv.textContent = "Error connecting to the server.";
              });
          })
          .catch((error) => {
            alert('Error accessing webcam: ' + error);
          });
      }
    };
  </script>
</body>
</html>
